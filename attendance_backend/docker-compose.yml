version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword   # Mật khẩu root của MySQL
      MYSQL_DATABASE: attendance_db       # Tên database sẽ tự động tạo
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - "8080:80"                         # Cổng để truy cập phpMyAdmin (quản lý DB)
    environment:
      PMA_HOST: db
    depends_on:
      - db

  api:
    build: .                              # Build image từ Dockerfile
    ports:
      - "80:80"                           # Cổng truy cập API từ Android (10.0.2.2:80)
    volumes:
      - ./src:/var/www/html               # Map thư mục src vào web server
      - ./uploads:/var/www/uploads
      - ./dataset:/var/www/dataset
    depends_on:
      - db

  ai_engine:
    build: ./ai_engine
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads
      - ./dataset:/app/dataset
      - ai_models:/root/.deepface
    depends_on:
      - api

volumes:
  db_data:
  ai_models: