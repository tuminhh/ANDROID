plugins {
    id 'com.android.application'
}

// Địa chỉ backend khi chạy debug. Máy ảo Android gọi máy tính qua 10.0.2.2.
// Đổi bằng: gradlew assembleDebug -PbaseUrl=http://192.168.1.10:8080/
def debugBaseUrl = (project.findProperty('baseUrl') ?: 'http://192.168.0.107:8080/').toString()
// Bản release bắt buộc HTTPS: đặt bằng -PreleaseBaseUrl=https://ten-mien-cua-ban/
def releaseBaseUrl = (project.findProperty('releaseBaseUrl') ?: 'https://doi-ten-mien.example.com/').toString()

android {
    namespace 'com.uni.attendance'
    compileSdk 34

    defaultConfig {
        applicationId "com.uni.attendance"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            buildConfigField 'String', 'BASE_URL', "\"${debugBaseUrl}\""
        }
        release {
            minifyEnabled false
            buildConfigField 'String', 'BASE_URL', "\"${releaseBaseUrl}\""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Không nén file mô hình TFLite để có thể map trực tiếp vào bộ nhớ
    androidResources {
        noCompress 'tflite'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Gọi backend
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Lưu token đăng nhập được mã hóa bằng Android Keystore
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Vị trí GPS cho các buổi điểm danh giới hạn phạm vi
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // CameraX
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'

    // Phát hiện khuôn mặt + nhận diện
    implementation 'com.google.mlkit:face-detection:16.1.6'
    implementation 'org.tensorflow:tensorflow-lite:2.14.0'
}
